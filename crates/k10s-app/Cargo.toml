[package]
name = "k10s"
description = "Multi-cluster Kubernetes desktop client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
default-run = "k10s"

[lib]
# `_lib` suffix avoids a name clash with the bin target on Windows (cargo#8519).
name = "k10s_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
k10s-core.workspace = true
# `devtools`: the Web Inspector (⌘⌥I / right click → Inspect) in release builds too. It uses private
# WebKit API on macOS, which only matters for the Mac App Store.
tauri = { workspace = true, features = ["devtools"] }
tauri-plugin-window-state.workspace = true
# Native confirmation before read-only mode is turned off (used from Rust only: the web view gets no
# permission for it, so nothing in it can answer the dialog).
tauri-plugin-dialog = "2.8"
# Updates from GitHub Releases, checked and installed from Rust only (no permission for the web view).
tauri-plugin-updater.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
jiff.workspace = true
dirs.workspace = true

[target.'cfg(unix)'.dependencies]
# Raising the open-file limit at startup (see `raise_open_file_limit`).
libc = "0.2"
