name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npx vite build

  rust:
    name: Rust (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            test: true
          - name: macOS
            os: macos-latest
            test: true
          # Builds and lints only: the engine's tests drive `sh` (exec plugins, shells) and assume Unix paths.
          - name: Windows
            os: windows-latest
            test: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        if: matrix.test
        run: cargo test --workspace --locked
      - name: Build tests
        if: ${{ !matrix.test }}
        run: cargo test --workspace --locked --no-run

  dependencies:
    name: Dependency licenses and sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Licenses of the npm packages the app ships
        run: node scripts/third-party-notices.mjs --check

  linux-metadata:
    name: Linux metadata (AppStream ${{ matrix.appstream }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest AppStream of the distributions k10s runs on, and the one the release builds check the packages
          # with: a warning fails a release after its builds.
          - os: ubuntu-22.04
            appstream: "0.15"
          # A newer one, which checks more.
          - os: ubuntu-24.04
            appstream: "1.0"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install appstreamcli
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream
      # No network checks: the screenshots' addresses name the version's tag, which comes after the release commit.
      - name: AppStream metadata
        run: appstreamcli validate --no-net --explain packaging/linux/io.dumkin.k10s.appdata.xml

  workflows:
    name: Workflows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
