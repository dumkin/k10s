# Asks every author of a pull request to sign the CLA (CLA.md) once, by a comment. See .github/scripts/cla.cjs.
#
# `pull_request_target` and `issue_comment` run the workflow and the script as they are on the default branch: the
# pull request's own code is never checked out or run here.

name: CLA

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}

jobs:
  cla:
    name: CLA signed
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (contains(github.event.comment.body, 'recheck') || contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')))
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v9
        env:
          # Who never needs to sign: the owner of the repository, and the logins in the repository variable
          # CLA_ALLOWLIST (comma-separated; the maintainers, when the owner is an organization). Bots never sign.
          CLA_ALLOWLIST: ${{ github.repository_owner }},${{ vars.CLA_ALLOWLIST }}
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/cla.cjs`);
            await run({ github, context, core });
