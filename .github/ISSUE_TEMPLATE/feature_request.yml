name: Feature request
description: Something k10s should do, or do differently.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem rather than the solution: what were you trying to get done, and where did k10s get in the way? The README's "Limitations and gaps" section lists what is known and planned.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were doing when you missed this. A real example beats an abstract one.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it working, including keys and screens if you have an idea.
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: kubectl, another client, a script, and what's wrong with that.
  - type: dropdown
    id: clusters
    attributes:
      label: How many clusters do you usually work with at once?
      options:
        - "1"
        - "2–5"
        - "6–20"
        - "More than 20"
